<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Kent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviewer</title>
</head>
<body>
    <h1><strong>Reviewer-PRIN135</strong></h1>
    <table border="1">
        <caption><h2>Tables</h2></caption>

        <thead>
            <tr>
                <th rowspan="2">Station</th>
                <th colspan="2">Temperature</th>
                <th rowspan="2">Humidity</th>
                <th rowspan="2">Weather</th>
            </tr>
            <tr>
                <th scope="col">Max</th>
                <th scope="col">Min</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>New York</td>
                <td>24</td>
                <td>19</td>
                <td>60%</td>
                <td>Cloudy</td>
            </tr>

            <tr>
                <td>Los Angeles</td>
                <td>30</td>
                <td>22</td>
                <td>50%</td>
                <td>Sunny</td>
        </tbody>
    </table>

    <h2>Input Form</h2>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <div>
                <label for="fname">First Name:</label>
                <input type="text" id="fname" name="fname" required placeholder="John">

                <label for="lname">Last Name:</label>
                <input type="text" id="lname" name="lname" required placeholder="Doe">
            </div>
            <br>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="@mls.ceu.edu.ph">

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <br>
            <div>
                <label for="gender">Gender:</label>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </div>
            <br>
            <div>
                <label for="skills">Skills:</label>
                <input type="checkbox" id="html" name="skills" value="html">
                <label for="html">HTML</label>
                <input type="checkbox" id="css" name="skills" value="css">
                <label for="css">CSS</label>
                <input type="checkbox" id="js" name="skills" value="js">
                <label for="js">JavaScript</label>  
            </div>
            <br>
            <div>
                <label for="country">Country:</label>
                <select id="country" name="country">
                    <option value="usa">USA</option>
                    <option value="canada">Canada</option>
                    <option value="uk">UK</option>
                    <option value="australia">Australia</option>
                </select>
            </div>
            <br>
            <div>
                <label for="bio">Bio:</label>
                <textarea id="bio" name="bio" rows="4" cols="50" placeholder="Write something about yourself..."></textarea>
            </div>
            <br>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">

        </fieldset>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>

    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src=https://gmedia.playstation.com/is/image/SIEPDC/ps5-product-thumbnail-01-en-14sep21?$facebook$ alt="A photo of a playstation 5 console" width="600" height="300">
        <p>PlayStation 5 Console</p>
        <p>$ 499.99 </p>
    </section>

    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name">Cardholders Name<span style="color:red" aria-hidden="true">*</span></label>
            <input type="text" id="card-name" name="card-name" required>
            <br>
            <label for="card-number">Card Number<span style="color:red" aria-hidden="true">*</span></label>
            <input type="text" id="card-number" name="card-number" aria-describedby="card-number-help" required>

            <p id="card-number-help">Please enter your 16-digit card number without spaces or dashes.</p>

            <label for="expiry-date">Expiry Date<span style="color:red" aria-hidden="true">*</span></label>
            <input type="number" id="expiry-date" name="expiry-date" required max=4 placeholder="MM/YY">
            <br>
            <label for="ccv">CCV<span style="color:red" aria-hidden="true">*</span></label>
            <input type="text" id="ccv" name="ccv" required>

        </form>
    </section>

</body>

</html>
